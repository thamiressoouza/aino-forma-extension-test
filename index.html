
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Urban Analysis Viewer</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
      }

      #header {
        padding: 12px 16px;
        border-bottom: 1px solid #ddd;
        background: #ffffff;
      }

      #header h2 {
        margin: 0;
        font-size: 18px;
      }

      #header p {
        margin: 4px 0 0 0;
        font-size: 13px;
        color: #555;
      }

      #map {
        height: calc(100% - 64px);
        width: 100%;
      }

      .popup-table {
        border-collapse: collapse;
        font-size: 12px;
      }

      .popup-table th {
        text-align: left;
        padding: 3px 8px 3px 0;
        vertical-align: top;
        color: #333;
      }

      .popup-table td {

      .custom-pin {

        width: 28px;

      }

      .custom-pin span {
        position: absolute;

    </style>
  
<style id="forma-sdk-diagnostics-style">
  #forma-sdk-panel {
    padding: 10px 16px;
    border-bottom: 1px solid #ddd;
    background: #fafafa;
    font-size: 13px;
  }

  #diagnoseFormaButton {
    padding: 7px 10px;
    cursor: pointer;
    border: 1px solid #bbb;

    margin-right: 8px;
  }

  #formaSdkDiagnostics {
    margin-top: 8px;

    border-radius: 6px;

    max-height: 220px;
    overflow: auto;
    white-space: pre-wrap;
    display: none;
  }

  #map {
    height: calc(100% - 160px) !important;
  }
</style>


<style id="forma-canvas-render-style">
  #sendRegionalRoadButton,
  #clearFormaOverlayButton {
    padding: 7px 10px;
    cursor: pointer;
    border: 1px solid #bbb;
    background: white;
    border-radius: 4px;
    margin-right: 8px;
  }

</head>

  <body>
    <div id="header">
      <h2>Urban Analysis Viewer v0.2</h2>
      <p>Regional roads, open space, bus stops and train station.</p>
    </div>

    
<div id="forma-sdk-panel">
  <button id="diagnoseFormaButton">Diagnose Forma SDK</button>
  
<button id="sendRegionalRoadButton">Send Regional Road to Forma canvas</button>
<button id="clearFormaOverlayButton">Clear Forma canvas overlay</button>

  <span>Use this inside Autodesk Forma to check canvas/API access.</span>
  <pre id="formaSdkDiagnostics"></pre>
</div>

<div id="map"></div>

    <script>
      const embeddedLayers = window.AINO_LAYERS || [];
      window.embeddedLayers = embeddedLayers;

      console.log("Urban Analysis Viewer build:", "v0_2_rebuilt_002");
      console.log("Embedded layers:", embeddedLayers);

      const map = L.map("map");

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 20,
        attribution: "© OpenStreetMap contributors"
      }).addTo(map);

      const overlayLayers = {};
      const allBounds = [];

      function cleanValue(value) {
        if (
          value === undefined ||
          value === null ||
          String(value).toLowerCase() === "nan" ||
          String(value).toLowerCase() === "none"
        ) {
          return "";
        }

        return String(value);
      }

      function buildPopupTable(properties) {
        const preferredFields = [
          "display_name",
          "name",
          "road_code",
          "road_class",
          "road_name",
          "roadnumber",
          "roadclass",
          "highway",
          "public_transport",
          "railway",
          "stationname",
          "source_layer",
          "source_file",
          "feature_uid"
        ];

        const rows = [];

        preferredFields.forEach((field) => {
          const value = cleanValue(properties[field]);

          if (value !== "") {
            rows.push(`<tr><th>${field}</th><td>${value}</td></tr>`);
          }
        });

        return `<table class="popup-table">${rows.join("")}</table>`;
      }

      function getFeatureStyle(layerId, feature) {
        const geometryType = feature.geometry?.type || "";
        const properties = feature.properties || {};

        if (geometryType === "Polygon" || geometryType === "MultiPolygon") {
          return getPolygonStyle(layerId, properties);
        }

        return getLineStyle(layerId, properties);
      }

      function getPolygonStyle(layerId, properties) {
        const sourceLayer = cleanValue(properties.source_layer).toLowerCase();
        const sourceFile = cleanValue(properties.source_file).toLowerCase();
        const landuse = cleanValue(properties.landuse).toLowerCase();
        const leisure = cleanValue(properties.leisure).toLowerCase();
        const amenity = cleanValue(properties.amenity).toLowerCase();
        const natural = cleanValue(properties.natural).toLowerCase();

        const searchableText = [
          layerId,
          sourceLayer,
          sourceFile,
          landuse,
          leisure,
          amenity,
          natural
        ].join(" ");

        if (
          layerId === "open_space_and_amenity" ||
          searchableText.includes("open_space") ||
          searchableText.includes("open space") ||
          searchableText.includes("park") ||
          searchableText.includes("green") ||
          searchableText.includes("grass") ||
          searchableText.includes("forest") ||
          searchableText.includes("wood") ||
          searchableText.includes("recreation") ||
          searchableText.includes("meadow")
        ) {
          return {
            color: "#145A32",
            weight: 1,
            opacity: 0.85,
            fillColor: "#145A32",
            fillOpacity: 0.45
          };
        }

        if (
          searchableText.includes("river") ||
          searchableText.includes("lake") ||
          searchableText.includes("water") ||
          searchableText.includes("wetland") ||
          searchableText.includes("pond")
        ) {
          return {
            color: "#8CCBFF",
            weight: 1,
            opacity: 0.9,
            fillColor: "#8CCBFF",
            fillOpacity: 0.35
          };
        }

        return {
          color: "#858488",
          weight: 1,
          opacity: 0.9,
          fillColor: "#858488",
          fillOpacity: 0.25
        };
      }

      function getLineStyle(layerId, properties) {
        const sourceLayer = cleanValue(properties.source_layer).toLowerCase();
        const sourceFile = cleanValue(properties.source_file).toLowerCase();
        const roadClass = cleanValue(properties.road_class).toLowerCase();
        const roadclass = cleanValue(properties.roadclass).toLowerCase();

        const searchableText = [
          layerId,
          sourceLayer,
          sourceFile,
          roadClass,
          roadclass
        ].join(" ");

        if (layerId === "regional_road" || searchableText.includes("regional")) {
          return {
            color: "#FFA800",
            weight: 2,
            opacity: 0.95
          };
        }

        if (
          layerId === "pedestrian_route_site_to_calbridge_town_centre" ||
          layerId === "pedestrian_route_site_to_train_station" ||
          searchableText.includes("pedestrian") ||
          searchableText.includes("walk") ||
          searchableText.includes("route")
        ) {
          return {
            color: "#7FAAFF",
            weight: 3,
            opacity: 0.9
          };
        }

        if (
          layerId === "high_voltage_overhead_power_lines" ||
          searchableText.includes("high_voltage") ||
          searchableText.includes("power") ||
          searchableText.includes("overhead") ||
          searchableText.includes("electric")
        ) {
          return {
            color: "#7B74FF",
            weight: 2,
            opacity: 0.9
          };
        }

        if (
          layerId === "rivers_and_lakes_within_2500m_buffer_around_site" ||
          searchableText.includes("river") ||
          searchableText.includes("lake") ||
          searchableText.includes("water") ||
          searchableText.includes("buffer")
        ) {
          return {
            color: "#8CCBFF",
            weight: 3,
            opacity: 0.9
          };
        }

        return {
          color: "#858488",
          weight: 2,
          opacity: 0.85
        };
      }

      function createPinIcon(color, iconName) {
        const html = `
          <div class="custom-pin" style="background: ${color};">
            <span>
              <i class="fa fa-${iconName}"></i>
            </span>
          </div>
        `;

        return L.divIcon({
          html: html,
          className: "",
          iconSize: [28, 28],
          iconAnchor: [14, 28],
          popupAnchor: [0, -28]
        });
      }

      function pointToLayer(feature, latlng) {
        const properties = feature.properties || {};

        const sourceLayer = cleanValue(properties.source_layer).toLowerCase();
        const highway = cleanValue(properties.highway).toLowerCase();
        const publicTransport = cleanValue(properties.public_transport).toLowerCase();
        const railway = cleanValue(properties.railway).toLowerCase();
        const stationName = cleanValue(properties.stationname);

        const searchableText = [
          sourceLayer,
          highway,
          publicTransport,
          railway,
          stationName
        ].join(" ").toLowerCase();

        if (
          sourceLayer.includes("bus_stop") ||
          highway === "bus_stop" ||
          searchableText.includes("bus_stop") ||
          searchableText.includes("bus stop")
        ) {
          return L.marker(latlng, {
            icon: createPinIcon("#FFA800", "bus")
          });
        }

        if (
          sourceLayer.includes("train_station") ||
          railway === "station" ||
          stationName !== ""
        ) {
          return L.marker(latlng, {
            icon: createPinIcon("#94C77A", "train")
          });
        }

        return L.circleMarker(latlng, {
          radius: 4,
          color: "#858488",
          fillColor: "#858488",
          fillOpacity: 0.85,
          opacity: 0.85,
          weight: 1
        });
      }

      function onEachFeature(feature, layer) {
        const properties = feature.properties || {};

        layer.bindPopup(buildPopupTable(properties));

        if (properties.display_name) {
          layer.bindTooltip(properties.display_name, {
            sticky: true
          });
        }
      }

      embeddedLayers.forEach((layerInfo) => {
        const leafletLayer = L.geoJSON(layerInfo.geojson, {
          style: function (feature) {
            return getFeatureStyle(layerInfo.id, feature);
          },
          pointToLayer: pointToLayer,
          onEachFeature: onEachFeature
        });

        overlayLayers[layerInfo.name] = leafletLayer;
        leafletLayer.addTo(map);

        const bounds = leafletLayer.getBounds();

        if (bounds.isValid()) {
          allBounds.push(bounds);
        }
      });

      L.control.layers(null, overlayLayers, {
        collapsed: false
      }).addTo(map);

      if (allBounds.length > 0) {
        const combinedBounds = allBounds[0];

        for (let i = 1; i < allBounds.length; i += 1) {
          combinedBounds.extend(allBounds[i]);
        }

        map.fitBounds(combinedBounds, {
          padding: [20, 20]
        });
      } else {
        map.setView([53.35, -6.26], 10);
      }
    </script>
  
<script type="module" id="forma-sdk-diagnostics-script">
  import { Forma } from "https://esm.sh/forma-embedded-view-sdk@0.93.0/auto?bundle";

  window.FormaSDK = Forma;

  const diagnosticsElement = document.getElementById("formaSdkDiagnostics");
  const diagnoseButton = document.getElementById("diagnoseFormaButton");

  function setDiagnostics(value) {
    diagnosticsElement.style.display = "block";
    diagnosticsElement.textContent =
      typeof value === "string" ? value : JSON.stringify(value, null, 2);
  }

  function normalizeError(error) {
    if (error instanceof Error) {
      return `${error.name}: ${error.message}`;
    }

    return String(error);
  }

  async function safeCall(label, callback) {
    try {
      const value = await callback();

      return {
        ok: true,
        value: value
      };
    } catch (error) {
      return {
        ok: false,
        error: normalizeError(error)
      };
    }
  }

  function getFunctionNames(obj) {
    if (!obj) {
      return [];
    }

    const names = new Set();
    let current = obj;

    while (current && current !== Object.prototype) {
      for (const name of Object.getOwnPropertyNames(current)) {
        try {
          if (
            typeof obj[name] === "function" &&
            name !== "constructor" &&
            !name.startsWith("_")
          ) {
            names.add(name);
          }
        } catch (error) {
          // Ignore inaccessible properties.
        }
      }

      current = Object.getPrototypeOf(current);
    }

    return Array.from(names).sort();
  }

  function isInsideIframe() {
    try {
      return window.self !== window.top;
    } catch (error) {
      return true;
    }
  }

  async function runFormaDiagnostics() {
    setDiagnostics("Running Forma SDK diagnostics...");

    const report = {
      build: "v0_3b_render_regional_road_001",
      pageUrl: window.location.href,
      isInsideIframe: isInsideIframe(),
      formaLoaded: Boolean(Forma),
      topLevelApis: Object.keys(Forma || {}).sort(),
      availableFunctions: {
        terrain: getFunctionNames(Forma?.terrain),
        render: getFunctionNames(Forma?.render),
        renderGeojson: getFunctionNames(Forma?.render?.geojson),
        geoData: getFunctionNames(Forma?.geoData),
        project: getFunctionNames(Forma?.project),
        proposal: getFunctionNames(Forma?.proposal),
        camera: getFunctionNames(Forma?.camera)
      },
      calls: {}
    };

    if (Forma?.terrain?.getBbox) {
      report.calls["terrain.getBbox"] = await safeCall(
        "terrain.getBbox",
        () => Forma.terrain.getBbox()
      );
    }

    if (Forma?.camera?.get) {
      report.calls["camera.get"] = await safeCall(
        "camera.get",
        () => Forma.camera.get()
      );
    }

    if (Forma?.project?.getGeoLocation) {
      report.calls["project.getGeoLocation"] = await safeCall(
        "project.getGeoLocation",
        () => Forma.project.getGeoLocation()
      );
    }

    if (Forma?.proposal?.getId) {
      report.calls["proposal.getId"] = await safeCall(
        "proposal.getId",
        () => Forma.proposal.getId()
      );
    }

    setDiagnostics(report);
    console.log("Forma SDK diagnostics:", report);
  }

  diagnoseButton?.addEventListener("click", () => {
    void runFormaDiagnostics();
  });
</script>


<script type="module" id="forma-canvas-render-script">
  import { Forma } from "https://esm.sh/forma-embedded-view-sdk@0.93.0/auto?bundle";

  const sendButton = document.getElementById("sendRegionalRoadButton");
  const clearButton = document.getElementById("clearFormaOverlayButton");
  const diagnosticsElement = document.getElementById("formaSdkDiagnostics");

  let currentRenderResult = null;

  function writeCanvasStatus(value) {
    if (!diagnosticsElement) {
      console.log("Canvas render status:", value);
      return;
    }

    diagnosticsElement.style.display = "block";
    diagnosticsElement.textContent =
      typeof value === "string" ? value : JSON.stringify(value, null, 2);
  }

  function normalizeError(error) {
    if (error instanceof Error) {
      return `${error.name}: ${error.message}`;
    }

    return String(error);
  }

  function metersFromLonLat(lon, lat, originLon, originLat) {
    const metersPerDegreeLat = 111320;
    const metersPerDegreeLon = 111320 * Math.cos(originLat * Math.PI / 180);

    return [
      (lon - originLon) * metersPerDegreeLon,
      (lat - originLat) * metersPerDegreeLat
    ];
  }

  function transformCoordinatesToFormaLocal(coordinates, originLon, originLat) {
    if (
      Array.isArray(coordinates) &&
      coordinates.length >= 2 &&
      typeof coordinates[0] === "number" &&
      typeof coordinates[1] === "number"
    ) {
      return metersFromLonLat(coordinates[0], coordinates[1], originLon, originLat);
    }

    return coordinates.map((part) =>
      transformCoordinatesToFormaLocal(part, originLon, originLat)
    );
  }

  function transformFeatureCollectionToFormaLocal(geojson, originLon, originLat) {
    return {
      type: "FeatureCollection",
      features: geojson.features
        .filter((feature) => feature.geometry)
        .map((feature) => {
          return {
            type: "Feature",
            properties: feature.properties || {},
            geometry: {
              type: feature.geometry.type,
              coordinates: transformCoordinatesToFormaLocal(
                feature.geometry.coordinates,
                originLon,
                originLat
              )
            }
          };
        })
    };
  }

  function getLayerById(layerId) {
    return (window.AINO_LAYERS || []).find((layer) => layer.id === layerId);
  }

  async function sendRegionalRoadToFormaCanvas() {
    try {
      writeCanvasStatus("Sending Regional Road to Forma canvas...");

      if (!Forma?.render?.geojson?.add) {
        throw new Error("Forma.render.geojson.add is not available.");
      }

      const projectGeoLocation = await Forma.project.getGeoLocation();
      const originLat = projectGeoLocation[0];
      const originLon = projectGeoLocation[1];

      const layer = getLayerById("regional_road");

      if (!layer) {
        throw new Error("Layer not found in window.AINO_LAYERS: regional_road");
      }

      const formaLocalGeojson = transformFeatureCollectionToFormaLocal(
        layer.geojson,
        originLon,
        originLat
      );

      currentRenderResult = await Forma.render.geojson.add({
        geojson: formaLocalGeojson
      });

      writeCanvasStatus({
        build: "v0_3b_render_regional_road_001",
        action: "sendRegionalRoadToFormaCanvas",
        ok: true,
        projectGeoLocation: projectGeoLocation,
        sourceLayer: {
          id: layer.id,
          name: layer.name,
          featureCount: layer.geojson.features.length
        },
        transformedFeatureCount: formaLocalGeojson.features.length,
        renderResult: currentRenderResult,
        note: "If geometry appears shifted or rotated, the lon/lat-to-local transform needs refinement."
      });

      console.log("Forma render result:", currentRenderResult);
      console.log("Forma local GeoJSON sent:", formaLocalGeojson);

    } catch (error) {
      writeCanvasStatus({
        build: "v0_3b_render_regional_road_001",
        action: "sendRegionalRoadToFormaCanvas",
        ok: false,
        error: normalizeError(error)
      });
    }
  }

  async function clearFormaCanvasOverlay() {
    try {
      writeCanvasStatus("Clearing Forma canvas overlay...");

      if (Forma?.render?.geojson?.cleanup) {
        await Forma.render.geojson.cleanup();
      } else if (Forma?.render?.cleanup) {
        await Forma.render.cleanup();
      } else {
        throw new Error("No cleanup function found on Forma.render.");
      }

      currentRenderResult = null;

      writeCanvasStatus({
        build: "v0_3b_render_regional_road_001",
        action: "clearFormaCanvasOverlay",
        ok: true
      });

    } catch (error) {
      writeCanvasStatus({
        build: "v0_3b_render_regional_road_001",
        action: "clearFormaCanvasOverlay",
        ok: false,
        error: normalizeError(error)
      });
    }
  }

  sendButton?.addEventListener("click", () => {
    void sendRegionalRoadToFormaCanvas();
  });

  clearButton?.addEventListener("click", () => {
    void clearFormaCanvasOverlay();
  });
</script>
