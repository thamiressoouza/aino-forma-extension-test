
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Urban Analysis Viewer</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./data.js?v=v0_2_rebuilt_001"></script>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
      }

      #header {
        padding: 12px 16px;
        border-bottom: 1px solid #ddd;
        background: #ffffff;
      }

      #header h2 {
        margin: 0;
        font-size: 18px;
      }

      #header p {
        margin: 4px 0 0 0;
        font-size: 13px;
        color: #555;
      }

      #map {
        height: calc(100% - 64px);
        width: 100%;
      }

      .popup-table {
        border-collapse: collapse;
        font-size: 12px;
      }

      .popup-table th {
        text-align: left;
        padding: 3px 8px 3px 0;
        vertical-align: top;
        color: #333;
      }

      .popup-table td {
        padding: 3px 0;
        color: #111;
      }

      .custom-pin {
        position: relative;
        width: 28px;
        height: 28px;
        border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg);
        border: 2px solid white;
        box-shadow: 0 1px 4px rgba(0,0,0,0.35);
      }

      .custom-pin span {
        position: absolute;
        color: white;
        font-size: 14px;
        font-weight: bold;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) rotate(45deg);
      }
    </style>
  </head>

  <body>
    <div id="header">
      <h2>Urban Analysis Viewer v0.2</h2>
      <p>Regional roads, open space, bus stops and train station.</p>
    </div>

    <div id="map"></div>

    <script>
      const embeddedLayers = window.AINO_LAYERS || [];
      window.embeddedLayers = embeddedLayers;

      console.log("Urban Analysis Viewer build:", "v0_2_rebuilt_001");
      console.log("Embedded layers:", embeddedLayers);

      const map = L.map("map");

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 20,
        attribution: "© OpenStreetMap contributors"
      }).addTo(map);

      const overlayLayers = {};
      const allBounds = [];

      function cleanValue(value) {
        if (
          value === undefined ||
          value === null ||
          String(value).toLowerCase() === "nan" ||
          String(value).toLowerCase() === "none"
        ) {
          return "";
        }

        return String(value);
      }

      function buildPopupTable(properties) {
        const preferredFields = [
          "display_name",
          "name",
          "road_code",
          "road_class",
          "road_name",
          "roadnumber",
          "roadclass",
          "highway",
          "public_transport",
          "railway",
          "stationname",
          "source_layer",
          "source_file",
          "feature_uid"
        ];

        const rows = [];

        preferredFields.forEach((field) => {
          const value = cleanValue(properties[field]);

          if (value !== "") {
            rows.push(`<tr><th>${field}</th><td>${value}</td></tr>`);
          }
        });

        return `<table class="popup-table">${rows.join("")}</table>`;
      }

      function getFeatureStyle(layerId, feature) {
        const geometryType = feature.geometry?.type || "";
        const properties = feature.properties || {};

        if (geometryType === "Polygon" || geometryType === "MultiPolygon") {
          return getPolygonStyle(layerId, properties);
        }

        return getLineStyle(layerId, properties);
      }

      function getPolygonStyle(layerId, properties) {
        const sourceLayer = cleanValue(properties.source_layer).toLowerCase();
        const sourceFile = cleanValue(properties.source_file).toLowerCase();
        const landuse = cleanValue(properties.landuse).toLowerCase();
        const leisure = cleanValue(properties.leisure).toLowerCase();
        const amenity = cleanValue(properties.amenity).toLowerCase();
        const natural = cleanValue(properties.natural).toLowerCase();

        const searchableText = [
          layerId,
          sourceLayer,
          sourceFile,
          landuse,
          leisure,
          amenity,
          natural
        ].join(" ");

        if (
          layerId === "open_space_and_amenity" ||
          searchableText.includes("open_space") ||
          searchableText.includes("open space") ||
          searchableText.includes("park") ||
          searchableText.includes("green") ||
          searchableText.includes("grass") ||
          searchableText.includes("forest") ||
          searchableText.includes("wood") ||
          searchableText.includes("recreation") ||
          searchableText.includes("meadow")
        ) {
          return {
            color: "#145A32",
            weight: 1,
            opacity: 0.85,
            fillColor: "#145A32",
            fillOpacity: 0.45
          };
        }

        if (
          searchableText.includes("river") ||
          searchableText.includes("lake") ||
          searchableText.includes("water") ||
          searchableText.includes("wetland") ||
          searchableText.includes("pond")
        ) {
          return {
            color: "#8CCBFF",
            weight: 1,
            opacity: 0.9,
            fillColor: "#8CCBFF",
            fillOpacity: 0.35
          };
        }

        return {
          color: "#858488",
          weight: 1,
          opacity: 0.9,
          fillColor: "#858488",
          fillOpacity: 0.25
        };
      }

      function getLineStyle(layerId, properties) {
        const sourceLayer = cleanValue(properties.source_layer).toLowerCase();
        const sourceFile = cleanValue(properties.source_file).toLowerCase();
        const roadClass = cleanValue(properties.road_class).toLowerCase();
        const roadclass = cleanValue(properties.roadclass).toLowerCase();

        const searchableText = [
          layerId,
          sourceLayer,
          sourceFile,
          roadClass,
          roadclass
        ].join(" ");

        if (layerId === "regional_road" || searchableText.includes("regional")) {
          return {
            color: "#FFA800",
            weight: 2,
            opacity: 0.95
          };
        }

        if (
          layerId === "pedestrian_route_site_to_calbridge_town_centre" ||
          layerId === "pedestrian_route_site_to_train_station" ||
          searchableText.includes("pedestrian") ||
          searchableText.includes("walk") ||
          searchableText.includes("route")
        ) {
          return {
            color: "#7FAAFF",
            weight: 3,
            opacity: 0.9
          };
        }

        if (
          layerId === "high_voltage_overhead_power_lines" ||
          searchableText.includes("high_voltage") ||
          searchableText.includes("power") ||
          searchableText.includes("overhead") ||
          searchableText.includes("electric")
        ) {
          return {
            color: "#7B74FF",
            weight: 2,
            opacity: 0.9
          };
        }

        if (
          layerId === "rivers_and_lakes_within_2500m_buffer_around_site" ||
          searchableText.includes("river") ||
          searchableText.includes("lake") ||
          searchableText.includes("water") ||
          searchableText.includes("buffer")
        ) {
          return {
            color: "#8CCBFF",
            weight: 3,
            opacity: 0.9
          };
        }

        return {
          color: "#858488",
          weight: 2,
          opacity: 0.85
        };
      }

      function createPinIcon(color, iconName) {
        const html = `
          <div class="custom-pin" style="background: ${color};">
            <span>
              <i class="fa fa-${iconName}"></i>
            </span>
          </div>
        `;

        return L.divIcon({
          html: html,
          className: "",
          iconSize: [28, 28],
          iconAnchor: [14, 28],
          popupAnchor: [0, -28]
        });
      }

      function pointToLayer(feature, latlng) {
        const properties = feature.properties || {};

        const sourceLayer = cleanValue(properties.source_layer).toLowerCase();
        const highway = cleanValue(properties.highway).toLowerCase();
        const publicTransport = cleanValue(properties.public_transport).toLowerCase();
        const railway = cleanValue(properties.railway).toLowerCase();
        const stationName = cleanValue(properties.stationname);

        const searchableText = [
          sourceLayer,
          highway,
          publicTransport,
          railway,
          stationName
        ].join(" ").toLowerCase();

        if (
          sourceLayer.includes("bus_stop") ||
          highway === "bus_stop" ||
          searchableText.includes("bus_stop") ||
          searchableText.includes("bus stop")
        ) {
          return L.marker(latlng, {
            icon: createPinIcon("#FFA800", "bus")
          });
        }

        if (
          sourceLayer.includes("train_station") ||
          railway === "station" ||
          stationName !== ""
        ) {
          return L.marker(latlng, {
            icon: createPinIcon("#94C77A", "train")
          });
        }

        return L.circleMarker(latlng, {
          radius: 4,
          color: "#858488",
          fillColor: "#858488",
          fillOpacity: 0.85,
          opacity: 0.85,
          weight: 1
        });
      }

      function onEachFeature(feature, layer) {
        const properties = feature.properties || {};

        layer.bindPopup(buildPopupTable(properties));

        if (properties.display_name) {
          layer.bindTooltip(properties.display_name, {
            sticky: true
          });
        }
      }

      embeddedLayers.forEach((layerInfo) => {
        const leafletLayer = L.geoJSON(layerInfo.geojson, {
          style: function (feature) {
            return getFeatureStyle(layerInfo.id, feature);
          },
          pointToLayer: pointToLayer,
          onEachFeature: onEachFeature
        });

        overlayLayers[layerInfo.name] = leafletLayer;
        leafletLayer.addTo(map);

        const bounds = leafletLayer.getBounds();

        if (bounds.isValid()) {
          allBounds.push(bounds);
        }
      });

      L.control.layers(null, overlayLayers, {
        collapsed: false
      }).addTo(map);

      if (allBounds.length > 0) {
        const combinedBounds = allBounds[0];

        for (let i = 1; i < allBounds.length; i += 1) {
          combinedBounds.extend(allBounds[i]);
        }

        map.fitBounds(combinedBounds, {
          padding: [20, 20]
        });
      } else {
        map.setView([53.35, -6.26], 10);
      }
    </script>
  </body>
</html>
